spring.application.name=tonys-pizzeria
server.port=8080

# Tomcat runs every request on a virtual thread. This one line is the whole migration.
# The "traditional" endpoints hand their work to a fixed pool of 20 platform threads instead,
# so you can compare both in one app.
spring.threads.virtual.enabled=true

# ── 1. Halftime rush ───────────────────────────────────────────────────────────
# Size of each platform-thread pool: Tony's 20 waiters.
pizzeria.platform-threads=20
# How long each slow call takes, in milliseconds. One order = 500 + 250 + 250 = 1 second.
pizzeria.oven-ms=500
pizzeria.payment-ms=250
pizzeria.driver-ms=250
# At halftime a CompletableFuture order can wait a long time for a free thread.
spring.mvc.async.request-timeout=60s

# ── 3. Dough station (CPU-bound) ───────────────────────────────────────────────
# Work per order: how many times to knead the dough (plain arithmetic, no waiting).
# Aim for about 50 ms per order on your laptop (the "millis" in the response tells you).
pizzeria.cpu.work=30000000

# ── 4. The stuck waiter (pinning) ───────────────────────────────────────────────────
# How long each order waits for the oven while it holds a lock.
pizzeria.pinning.hold-ms=500

# ── 6. The oven nobody switched off (structured concurrency) ───────────────────
# Uses the oven, payment and driver times above. With ?paymentFails=true the card is declined after this long.
pizzeria.decline-ms=100

# Short log lines, easy to read on a projector.
logging.pattern.console=%d{HH:mm:ss.SSS} %msg%n
# If you stop JMeter halfway, Spring would warn about every closed connection. Keep it quiet.
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=error
